name: README Status

on:
  workflow_run:
    workflows: [Tailscale Exit Node]
    types: [in_progress, completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/readme-status.yml
      - .github/scripts/readme-status.py

# No Tailscale credentials or watchdog PAT are used by this observer.
permissions:
  actions: read
  contents: write

concurrency:
  group: readme-exit-node-status
  cancel-in-progress: false

jobs:
  report:
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch code, never the triggering run's SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update bilingual status blocks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/readme-status.py --publish
