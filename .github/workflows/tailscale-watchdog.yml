name: Tailscale Exit Node Watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-exit-node-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Check Exit Node Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: tailscale-exit-node.yml
          QUEUED_TIMEOUT_MINUTES: 10
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Tailscale Exit Node Watchdog"
          echo "=========================================="
          echo "Repository: $REPO"
          echo "Workflow:   $WORKFLOW"

          RUNS_API="https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/runs"
          DISPATCH_API="https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/dispatches"
          HEADERS=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          RUNS_JSON=$(curl -fsSL "${HEADERS[@]}" "$RUNS_API?per_page=20")

          ACTIVE_COUNT=$(echo "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status == "in_progress")] | length')
          QUEUED_COUNT=$(echo "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status == "queued")] | length')
          WAITING_COUNT=$(echo "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status == "waiting" or .status == "requested" or .status == "pending")] | length')

          echo "Active (in_progress): $ACTIVE_COUNT"
          echo "Queued:               $QUEUED_COUNT"
          echo "Waiting/requested:    $WAITING_COUNT"

          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "Exit Node workflow is currently running."
            exit 0
          fi

          NOW=$(date +%s)
          STALE_FOUND=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            [ -n "$RUN_ID" ] || continue

            CREATED_TS=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo 0)
            AGE_SECONDS=$((NOW - CREATED_TS))
            AGE_MINUTES=$((AGE_SECONDS / 60))

            echo "Queued run $RUN_ID age: ${AGE_MINUTES}m"

            if [ "$CREATED_TS" -gt 0 ] && [ "$AGE_SECONDS" -ge $((QUEUED_TIMEOUT_MINUTES * 60)) ]; then
              echo "Cancelling stale queued run: $RUN_ID"

              HTTP_CODE=$(curl -sS -o /tmp/cancel-response.json \
                -w "%{http_code}" \
                -X POST \
                "${HEADERS[@]}" \
                "$RUNS_API/$RUN_ID/cancel")

              echo "Cancel HTTP status: $HTTP_CODE"

              if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "409" ] && [ "$HTTP_CODE" != "404" ]; then
                echo "ERROR: Failed to cancel stale run $RUN_ID"
                cat /tmp/cancel-response.json || true
                exit 1
              fi

              STALE_FOUND=1
            fi
          done < <(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.status == "queued") | [.id, .created_at] | @tsv')

          if [ "$STALE_FOUND" -eq 1 ]; then
            sleep 3
            RUNS_JSON=$(curl -fsSL "${HEADERS[@]}" "$RUNS_API?per_page=20")
            ACTIVE_COUNT=$(echo "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status == "in_progress")] | length')
            QUEUED_COUNT=$(echo "$RUNS_JSON" | jq '[.workflow_runs[] | select(.status == "queued")] | length')
          fi

          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "An Exit Node run became active during cleanup."
            exit 0
          fi

          if [ "$QUEUED_COUNT" -gt 0 ]; then
            echo "A non-stale Exit Node run is still queued."
            echo "Waiting for GitHub Actions concurrency instead of creating another run."
            exit 0
          fi

          echo "No active or blocked Exit Node run found."
          echo "Starting a new Exit Node workflow..."

          HTTP_CODE=$(curl -sS -o /tmp/dispatch-response.json \
            -w "%{http_code}" \
            -X POST \
            "${HEADERS[@]}" \
            "$DISPATCH_API" \
            -d '{"ref":"main"}')

          echo "Dispatch HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Failed to dispatch Exit Node workflow."
            cat /tmp/dispatch-response.json || true
            echo
            echo "The watchdog now uses GITHUB_TOKEN with actions: write permission."
            exit 1
          fi

          echo "Exit Node workflow dispatch requested successfully."
