name: Tailscale Exit Node Watchdog

on:
  # Primary trigger: repair immediately after the Exit Node workflow finishes.
  workflow_run:
    workflows: [Tailscale Exit Node]
    types: [completed]

  # Independent PAT-backed backstop. This intentionally keeps the proven
  # periodic supervisor model from the original watchdog.
  schedule:
    - cron: '7,22,37,52 * * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'ensure = start or repair the exit node, stop = shut it down'
        required: false
        default: 'ensure'
        type: choice
        options:
          - ensure
          - stop

# The watchdog deliberately uses the dedicated PAT. This keeps recovery
# independent from the GITHUB_TOKEN permission model used by the Exit Node
# workflow itself.
permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-exit-node-watchdog
  cancel-in-progress: false

env:
  EXIT_NODE_WORKFLOW: tailscale-exit-node.yml

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Watchdog Token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ACTIONS_WATCHDOG_TOKEN is required for the PAT-backed watchdog."
            exit 1
          fi
          echo "Dedicated watchdog PAT is configured."

      # Stop remains an explicit kill switch. It runs through the same PAT so
      # it does not depend on GITHUB_TOKEN permissions.
      - name: Stop Exit Node
        if: ${{ inputs.action == 'stop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          AUTH=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          API="https://api.github.com/repos/${REPO}"

          echo "Setting the EXIT_NODE_DISABLED repository variable..."
          CODE="$(curl -sS -o /tmp/var.json -w '%{http_code}' \
            -X PATCH "${AUTH[@]}" -H 'Content-Type: application/json' \
            "${API}/actions/variables/EXIT_NODE_DISABLED" \
            -d '{"name":"EXIT_NODE_DISABLED","value":"true"}' || true)"

          if [ "$CODE" = "404" ]; then
            CODE="$(curl -sS -o /tmp/var.json -w '%{http_code}' \
              -X POST "${AUTH[@]}" -H 'Content-Type: application/json' \
              "${API}/actions/variables" \
              -d '{"name":"EXIT_NODE_DISABLED","value":"true"}' || true)"
          fi

          case "$CODE" in
            201|204)
              echo "Kill switch is set."
              ;;
            *)
              echo "::error::Could not set EXIT_NODE_DISABLED (HTTP ${CODE})."
              cat /tmp/var.json 2>/dev/null || true
              exit 1
              ;;
          esac

          RUNS="$(curl -fsSL "${AUTH[@]}" \
            "${API}/actions/workflows/${EXIT_NODE_WORKFLOW}/runs?per_page=30" || true)"
          if [ -z "$RUNS" ]; then
            echo "::warning::Could not list runs. The current run will finish normally."
            exit 0
          fi

          jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$RUNS" \
          | while read -r ID; do
              [ -n "$ID" ] || continue
              C="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST "${AUTH[@]}" "${API}/actions/runs/${ID}/cancel" || true)"
              echo "Run ${ID}: cancel returned HTTP ${C}"
            done

          echo "Exit node stopped."

      # The proven ensure logic remains the single source of truth for
      # idempotency, stale-run cleanup, confirmation and crash-loop protection.
      - name: Ensure an Exit Node Is Running
        if: ${{ inputs.action != 'stop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ env.EXIT_NODE_WORKFLOW }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: bash .github/scripts/ensure-exit-node.sh

      - name: Report State
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN }}
          REPO: ${{ github.repository }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: |
          set -uo pipefail
          RUNS="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${EXIT_NODE_WORKFLOW}/runs?per_page=5" \
            2>/dev/null || true)"

          {
            echo "### Tailscale Exit Node"
            echo
            case "${DISABLED,,}" in
              true|1|yes) echo "Kill switch \`EXIT_NODE_DISABLED\` is **on**. The node will not restart." ; echo ;;
            esac
            if [ -z "$RUNS" ]; then
              echo "GitHub API was unreachable; state unknown."
            else
              echo "| Run | Status | Conclusion | Started |"
              echo "| --- | ------ | ---------- | ------- |"
              jq -r '.workflow_runs[] |
                "| [\(.id)](\(.html_url)) | \(.status) | \(.conclusion // "-") | \(.run_started_at // .created_at) |"' \
                <<<"$RUNS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
