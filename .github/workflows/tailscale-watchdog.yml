name: Tailscale Exit Node Watchdog

on:
  # Primary trigger: react the moment an exit node run finishes, instead of
  # waiting for the next cron tick.
  workflow_run:
    workflows: [Tailscale Exit Node]
    types: [completed]

  # Backstop for the case where the self-relaunch chain is broken entirely,
  # for example because a dispatch was rejected while the API was degraded.
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'ensure = start or repair the exit node, stop = shut it down'
        required: false
        default: 'ensure'
        type: choice
        options:
          - ensure
          - stop

permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-exit-node-watchdog
  cancel-in-progress: false

env:
  EXIT_NODE_WORKFLOW: tailscale-exit-node.yml

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stopping has to happen here rather than in the exit node workflow: a
      # dispatch of that workflow can only queue behind the run that already
      # holds the concurrency group, so it could never stop it.
      - name: Stop Exit Node
        if: ${{ inputs.action == 'stop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          AUTH=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          API="https://api.github.com/repos/${REPO}"

          # The kill switch must be set first. Cancelling alone is not enough:
          # a cancelled run still triggers the relaunch job, which would start
          # a replacement.
          echo "Setting the EXIT_NODE_DISABLED repository variable..."
          CODE="$(curl -sS -o /tmp/var.json -w '%{http_code}' \
            -X PATCH "${AUTH[@]}" -H 'Content-Type: application/json' \
            "${API}/actions/variables/EXIT_NODE_DISABLED" \
            -d '{"name":"EXIT_NODE_DISABLED","value":"true"}' || true)"

          if [ "$CODE" = "404" ]; then
            CODE="$(curl -sS -o /tmp/var.json -w '%{http_code}' \
              -X POST "${AUTH[@]}" -H 'Content-Type: application/json' \
              "${API}/actions/variables" \
              -d '{"name":"EXIT_NODE_DISABLED","value":"true"}' || true)"
          fi

          case "$CODE" in
            201|204)
              echo "Kill switch is set. The relaunch chain will not restart the node."
              ;;
            *)
              echo "::error::Could not set EXIT_NODE_DISABLED (HTTP ${CODE})."
              cat /tmp/var.json 2>/dev/null || true
              echo "::error::ACTIONS_WATCHDOG_TOKEN needs a scope that permits writing repository variables."
              echo "::error::Set the variable manually, then re-run this workflow with action=stop."
              exit 1
              ;;
          esac

          echo "Cancelling active exit node runs..."
          RUNS="$(curl -fsSL "${AUTH[@]}" \
            "${API}/actions/workflows/${EXIT_NODE_WORKFLOW}/runs?per_page=30" || true)"
          if [ -z "$RUNS" ]; then
            echo "::warning::Could not list runs. The node stops on its own once the current run ends."
            exit 0
          fi

          jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$RUNS" \
          | while read -r ID; do
              [ -n "$ID" ] || continue
              C="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST "${AUTH[@]}" "${API}/actions/runs/${ID}/cancel" || true)"
              echo "Run ${ID}: cancel returned HTTP ${C}"
            done

          echo "Exit node stopped. Remove or set EXIT_NODE_DISABLED to false to start it again."

      - name: Ensure an Exit Node Is Running
        if: ${{ inputs.action != 'stop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ env.EXIT_NODE_WORKFLOW }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: bash .github/scripts/ensure-exit-node.sh

      - name: Report State
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: |
          set -uo pipefail
          RUNS="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${EXIT_NODE_WORKFLOW}/runs?per_page=5" \
            2>/dev/null || true)"

          {
            echo "### Tailscale Exit Node"
            echo
            case "${DISABLED,,}" in
              true|1|yes) echo "Kill switch \`EXIT_NODE_DISABLED\` is **on**. The node will not restart." ; echo ;;
            esac
            if [ -z "$RUNS" ]; then
              echo "GitHub API was unreachable; state unknown."
            else
              echo "| Run | Status | Conclusion | Started |"
              echo "| --- | ------ | ---------- | ------- |"
              jq -r '.workflow_runs[] |
                "| [\(.id)](\(.html_url)) | \(.status) | \(.conclusion // "-") | \(.run_started_at // .created_at) |"' \
                <<<"$RUNS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
