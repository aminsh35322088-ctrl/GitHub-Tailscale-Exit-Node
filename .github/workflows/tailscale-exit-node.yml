name: Tailscale Exit Node

on:
  # The exit node re-launches itself, so the schedule is only a backstop for
  # the case where the chain is broken entirely (see the watchdog workflow).
  schedule:
    - cron: '17 */6 * * *'

  # Starting the node manually. Stopping is handled by the watchdog workflow,
  # because a dispatch of this workflow can only ever queue behind the run that
  # is already holding the concurrency group.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  TAILSCALE_HOSTNAME: 'GitHub-Exit'
  # Minutes the node stays online before handing over to its successor.
  # Must leave headroom under the job timeout for the handover and the
  # graceful shutdown steps.
  ONLINE_MINUTES: 330

# At most one run of this workflow executes at a time. A run dispatched while
# another is active waits here instead of starting a second exit node, which is
# what makes the self-relaunch handover seamless.
concurrency:
  group: tailscale-exit-node
  cancel-in-progress: false

jobs:
  exit-node:
    runs-on: ubuntu-latest
    # GitHub's own ceiling for a job is 360 minutes. Staying under it keeps the
    # handover under this workflow's control instead of being killed mid-step.
    timeout-minutes: 350

    outputs:
      # Consumed by the relaunch job to decide whether a fallback is needed.
      queued: ${{ steps.handover.outputs.queued }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stop must take effect immediately, not after up to a full online cycle.
      # The `vars` context is resolved at job start, so a run queued before the
      # kill switch was set would otherwise still bring up an exit node.  Re-read
      # the live value and cancel ourselves before connecting.
      - name: Honor kill switch
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          VAL="${{ vars.EXIT_NODE_DISABLED }}"
          if [ -z "$VAL" ]; then
            VAL="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/variables/EXIT_NODE_DISABLED" \
              | jq -r '.value // empty' 2>/dev/null || true)"
          fi
          case "$VAL" in
            true|1|yes)
              echo "EXIT_NODE_DISABLED is set; cancelling this run so it does not start an exit node."
              curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/cancel" || true
              sleep 5
              ;;
            *) echo "Kill switch off; continuing." ;;
          esac

      - name: Enable IP Forwarding
        shell: bash
        run: |
          set -euo pipefail
          SYSCTL_FILE="/etc/sysctl.d/99-tailscale.conf"
          sudo tee "$SYSCTL_FILE" >/dev/null <<'EOF'
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
          EOF
          sudo sysctl -p "$SYSCTL_FILE"
          test "$(sysctl -n net.ipv4.ip_forward)" = "1"
          test "$(sysctl -n net.ipv6.conf.all.forwarding)" = "1"
          echo "IPv4 and IPv6 forwarding enabled."

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:exit
          hostname: ${{ env.TAILSCALE_HOSTNAME }}
          version: latest
          use-cache: "false"
          args: >-
            --advertise-exit-node
            --accept-dns=false

      - name: Enable Tailscale SSH
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh
          if sudo tailscale debug prefs | jq -e '.RunSSH == true' >/dev/null; then
            echo "Tailscale SSH enabled."
          else
            echo "ERROR: Failed to enable Tailscale SSH."
            exit 1
          fi

      - name: Verify Exit Node
        shell: bash
        run: |
          set -euo pipefail

          READY=false
          for i in $(seq 1 12); do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              break
            fi
            echo "Tailscale is not ready yet. Retry ${i}/12..."
            sleep 5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Tailscale did not become ready."
            exit 1
          fi

          echo "Hostname : ${TAILSCALE_HOSTNAME}"
          tailscale version
          echo "IPv4     : $(tailscale ip -4)"
          echo "IPv6     : $(tailscale ip -6 || echo unavailable)"

          # tag:exit is granted at authentication time by the OAuth client and
          # cannot be added afterwards with "tailscale set", so a missing tag is
          # a configuration problem rather than something to retry.
          if tailscale status --json | jq -e 'any(.Self.Tags[]?; . == "tag:exit")' >/dev/null; then
            echo "tag:exit : present"
          else
            echo "ERROR: tag:exit is missing from this node."
            echo "Check that the OAuth client owns tag:exit and that tagOwners permits it."
            exit 1
          fi

          # Advertising an exit node means advertising the default routes.
          if ! sudo tailscale debug prefs \
            | jq -e '[.AdvertiseRoutes // []] | flatten | index("0.0.0.0/0")' >/dev/null; then
            echo "Exit node routes are not advertised. Re-advertising..."
            sudo tailscale set --advertise-exit-node=true
            sleep 5
            sudo tailscale debug prefs \
              | jq -e '[.AdvertiseRoutes // []] | flatten | index("0.0.0.0/0")' >/dev/null || {
                echo "ERROR: Could not advertise exit node routes."
                exit 1
              }
          fi
          echo "Exit node: advertised"

          test "$(sysctl -n net.ipv4.ip_forward)" = "1"
          test "$(sysctl -n net.ipv6.conf.all.forwarding)" = "1"

          tailscale status

      - name: Keep Exit Node Alive
        shell: bash
        run: |
          set -uo pipefail
          SYSCTL_FILE="/etc/sysctl.d/99-tailscale.conf"
          TOTAL="$ONLINE_MINUTES"
          FAILURES=0
          MAX_FAILURES=3

          has_exit_tag() {
            tailscale status --json 2>/dev/null \
              | jq -e 'any(.Self.Tags[]?; . == "tag:exit")' >/dev/null 2>&1
          }
          advertises_exit() {
            sudo tailscale debug prefs 2>/dev/null \
              | jq -e '[.AdvertiseRoutes // []] | flatten | index("0.0.0.0/0")' >/dev/null 2>&1
          }
          ssh_enabled() {
            sudo tailscale debug prefs 2>/dev/null | jq -e '.RunSSH == true' >/dev/null 2>&1
          }

          # Wall-clock deadline: each iteration sleeps up to 60 s rather than
          # counting a fixed number of iterations, so the handover step always
          # has the full remaining budget and we never blow past the job
          # timeout-minutes ceiling.
          START_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( START_EPOCH + TOTAL * 60 ))
          i=0
          while true; do
            NOW_EPOCH="$(date +%s)"
            if [ "$NOW_EPOCH" -ge "$DEADLINE_EPOCH" ]; then break; fi
            REMAIN=$(( DEADLINE_EPOCH - NOW_EPOCH ))
            sleep_sec=$(( REMAIN < 60 ? REMAIN : 60 ))
            sleep "$sleep_sec"
            i=$((i + 1))

            if [ "$(sysctl -n net.ipv4.ip_forward)" != "1" ] \
              || [ "$(sysctl -n net.ipv6.conf.all.forwarding)" != "1" ]; then
              echo "[${i}] IP forwarding was disabled. Restoring..."
              sudo sysctl -p "$SYSCTL_FILE" || true
            fi

            if ! tailscale status >/dev/null 2>&1; then
              echo "[${i}] Tailscale is unreachable. Attempting recovery..."
              sudo sysctl -p "$SYSCTL_FILE" || true
              timeout 120 sudo tailscale up \
                --advertise-exit-node \
                --accept-dns=false \
                --ssh \
                --hostname="$TAILSCALE_HOSTNAME" \
                || true
              sleep 10

              if ! tailscale status >/dev/null 2>&1; then
                FAILURES=$((FAILURES + 1))
                echo "[${i}] Recovery failed (${FAILURES}/${MAX_FAILURES})."
                if [ "$FAILURES" -ge "$MAX_FAILURES" ]; then
                  echo "[${i}] Giving up so a replacement run can take over."
                  exit 1
                fi
                continue
              fi
              echo "[${i}] Tailscale recovered."
              FAILURES=0
            else
              FAILURES=0
            fi

            ssh_enabled || { echo "[${i}] Re-enabling Tailscale SSH..."; sudo tailscale set --ssh || true; }
            advertises_exit || { echo "[${i}] Re-advertising exit node..."; sudo tailscale set --advertise-exit-node=true || true; }

            # A lost tag cannot be repaired from here; surface it rather than
            # looping quietly on a node peers cannot use as an exit.
            has_exit_tag || echo "::warning::[${i}] tag:exit is missing. Peers cannot use this node as an exit node."

            echo "[${i}] Exit node healthy."
          done

      # Queue the successor while this run still holds the concurrency group.
      # The dispatched run waits in the queue and starts as soon as this run
      # ends, keeping the handover gap down to the runner startup time.
      - name: Queue Successor Run
        id: handover
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: |
          set -uo pipefail
          if bash .github/scripts/ensure-exit-node.sh; then
            echo "queued=true" >> "$GITHUB_OUTPUT"
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Handover failed. The relaunch job will retry."
          fi

      - name: Graceful Shutdown
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "Withdrawing exit node advertisement..."
          sudo tailscale set --advertise-exit-node=false \
            || echo "::warning::Could not withdraw the advertisement. It clears once the coordination server marks this node offline."
          sleep 5
          tailscale status || true

  # Fallback for the cases the handover step cannot cover: the job was cancelled
  # or failed at startup before reaching it, or the dispatch itself failed. When
  # the handover succeeded this job is skipped, so it adds no handover delay.
  relaunch:
    needs: [exit-node]
    if: ${{ always() && needs.exit-node.outputs.queued != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure a Successor Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_WATCHDOG_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DISABLED: ${{ vars.EXIT_NODE_DISABLED }}
        run: bash .github/scripts/ensure-exit-node.sh
