name: Tailscale Exit Node

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tailscale-exit-node
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Enable IP Forwarding
        shell: bash
        run: |
          set -e
          sudo sysctl -w net.ipv4.ip_forward=1
          echo "IPv4 forwarding:"
          sysctl net.ipv4.ip_forward

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:exit
          hostname: cynet-linux-exit
          version: latest
          args: --advertise-routes=0.0.0.0/0 --accept-dns=false --ssh

      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          READY=false
          for i in {1..12}; do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              echo "Tailscale is ready."
              break
            fi
            echo "Tailscale is not ready. Retry $i/12..."
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: Tailscale failed to become ready."
            exit 1
          fi

          echo "Tailscale IPv4:"
          tailscale ip -4

          echo "Tailscale status:"
          tailscale status

      - name: Keep Exit Node Alive
        shell: bash
        run: |
          set -u

          for i in {1..335}; do
            sleep 60

            if tailscale status >/dev/null 2>&1; then
              echo "[$i/335] Tailscale OK."
              continue
            fi

            echo "[$i/335] WARNING: Tailscale appears unhealthy. Reconnecting..."
            sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null

            tailscale up \
              --advertise-routes=0.0.0.0/0 \
              --accept-dns=false \
              --ssh \
              --hostname=cynet-linux-exit \
              || true

            sleep 10

            if tailscale status >/dev/null 2>&1; then
              echo "[$i/335] Tailscale successfully recovered."
            else
              echo "[$i/335] WARNING: Tailscale recovery attempt failed."
            fi
          done

      - name: Final Tailscale Status
        if: always()
        shell: bash
        run: |
          echo "Final Tailscale status:"
          tailscale status || true

          echo "Final Tailscale IPv4:"
          tailscale ip -4 || true
