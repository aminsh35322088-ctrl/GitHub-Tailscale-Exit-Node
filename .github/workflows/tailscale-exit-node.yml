name: Tailscale Exit Node

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tailscale-exit-node
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAILSCALE_HOSTNAME: 'GitHub-Exit'

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Enable IP Forwarding
        shell: bash
        run: |
          set -euo pipefail
          SYSCTL_FILE="/etc/sysctl.d/99-tailscale.conf"
          echo "Configuring IP forwarding..."
          sudo tee "$SYSCTL_FILE" >/dev/null <<'EOF'
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
          EOF
          sudo sysctl -p "$SYSCTL_FILE"
          test "$(sysctl -n net.ipv4.ip_forward)" = "1"
          test "$(sysctl -n net.ipv6.conf.all.forwarding)" = "1"
          echo "IPv4 forwarding: ENABLED"
          echo "IPv6 forwarding: ENABLED"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:exit
          hostname: ${{ env.TAILSCALE_HOSTNAME }}
          version: latest
          use-cache: "false"
          args: >-
            --advertise-exit-node
            --accept-dns=false

      - name: Enable Tailscale SSH
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh
          if sudo tailscale debug prefs 2>/dev/null | grep -q '"RunSSH": true'; then
            echo "Tailscale SSH enabled."
          else
            echo "ERROR: Failed to enable Tailscale SSH."
            exit 1
          fi

      - name: Verify Tailscale
        shell: bash
        run: |
          set -euo pipefail
          READY=false
          for i in {1..12}; do
            if tailscale status >/dev/null 2>&1; then
              READY=true
              echo "Tailscale is ready."
              break
            fi
            echo "Tailscale is not ready. Retry $i/12..."
            sleep 5
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: Tailscale failed to become ready."
            exit 1
          fi
          echo "Tailscale hostname: $TAILSCALE_HOSTNAME"
          echo "Tailscale version:"
          tailscale version
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "Tailscale IPv6:"
          tailscale ip -6 || true
          echo "Tailscale status:"
          tailscale status
          test "$(sysctl -n net.ipv4.ip_forward)" = "1"
          test "$(sysctl -n net.ipv6.conf.all.forwarding)" = "1"
          if sudo tailscale debug prefs 2>/dev/null | grep -q '"RunSSH": true'; then
            echo "Tailscale SSH: ENABLED"
          else
            echo "ERROR: Tailscale SSH is not enabled."
            exit 1
          fi

      - name: Keep Exit Node Alive
        shell: bash
        run: |
          set -u
          SYSCTL_FILE="/etc/sysctl.d/99-tailscale.conf"
          for i in {1..335}; do
            sleep 60
            if [ "$(sysctl -n net.ipv4.ip_forward)" != "1" ] || [ "$(sysctl -n net.ipv6.conf.all.forwarding)" != "1" ]; then
              echo "[$i/335] WARNING: IP forwarding is disabled."
              sudo sysctl -p "$SYSCTL_FILE" || true
            fi
            if ! tailscale status >/dev/null 2>&1; then
              echo "[$i/335] WARNING: Tailscale appears unhealthy."
              sudo sysctl -p "$SYSCTL_FILE" || true
              sudo tailscale up \
                --advertise-exit-node \
                --accept-dns=false \
                --ssh \
                --hostname="$TAILSCALE_HOSTNAME" \
                || true
              sleep 10
            fi
            if sudo tailscale debug prefs 2>/dev/null | grep -q '"RunSSH": true'; then
              echo "[$i/335] Tailscale SSH OK."
            else
              sudo tailscale set --ssh || true
            fi
            if tailscale status >/dev/null 2>&1; then
              echo "[$i/335] Exit Node healthy."
            else
              echo "[$i/335] WARNING: Exit Node still unhealthy."
            fi
          done

      - name: Final Tailscale Status
        if: always()
        shell: bash
        run: |
          echo "Final Tailscale status:"
          tailscale status || true
          echo "Final Tailscale IPv4:"
          tailscale ip -4 || true
          echo "Final Tailscale IPv6:"
          tailscale ip -6 || true
          echo "Final Tailscale hostname:"
          echo "$TAILSCALE_HOSTNAME"
          echo "Final Tailscale version:"
          tailscale version || true
          echo "Final IP forwarding state:"
          sysctl net.ipv4.ip_forward || true
          sysctl net.ipv6.conf.all.forwarding || true
          echo "Final Tailscale SSH state:"
          if sudo tailscale debug prefs 2>/dev/null | grep -q '"RunSSH": true'; then
            echo "Enabled"
          else
            echo "Disabled"
          fi
