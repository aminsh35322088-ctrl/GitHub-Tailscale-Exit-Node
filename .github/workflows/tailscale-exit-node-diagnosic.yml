name: Tailscale SSH Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: tailscale-ssh-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

          tags: tag:exit

          # جدا از hostname اصلی Exit Node
          hostname: cynet-linux-ssh-diagnostic

          # آخرین نسخه
          version: latest

          # بدون cache برای تست نسخه جدید
          use-cache: "false"

          # عمداً هیچ exit routeی advertise نمی‌کنیم
          args: --accept-dns=false

      - name: Enable Tailscale SSH
        shell: bash
        run: |
          set -euxo pipefail

          echo "Enabling Tailscale SSH..."
          tailscale set --ssh

          sleep 5

      - name: Diagnostic
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "CURRENT USER"
          echo "========================================"
          whoami
          id
          echo "HOME=$HOME"

          echo
          echo "========================================"
          echo "AVAILABLE LOGIN USERS"
          echo "========================================"
          getent passwd | awk -F: '
            $7 !~ /(nologin|false)$/ {
              print "user=" $1 \
                    " uid=" $3 \
                    " home=" $6 \
                    " shell=" $7
            }
          '

          echo
          echo "========================================"
          echo "PASSWORD STATUS"
          echo "========================================"
          echo "root:"
          sudo passwd -S root || true

          CURRENT_USER="$(whoami)"

          echo
          echo "Current user ($CURRENT_USER):"
          sudo passwd -S "$CURRENT_USER" || true

          echo
          echo "========================================"
          echo "TAILSCALE VERSION"
          echo "========================================"
          tailscale version || true

          echo
          echo "========================================"
          echo "TAILSCALE IP"
          echo "========================================"
          tailscale ip -4 || true

          echo
          echo "========================================"
          echo "TAILSCALE STATUS"
          echo "========================================"
          tailscale status || true

          echo
          echo "========================================"
          echo "TAILSCALE PREFS"
          echo "========================================"
          tailscale debug prefs || true

          echo
          echo "========================================"
          echo "TAILSCALE STATUS JSON"
          echo "========================================"
          tailscale status --json || true

          echo
          echo "========================================"
          echo "TAILSCALE HOSTNAME"
          echo "========================================"
          hostname || true
          hostname -f || true

          echo
          echo "========================================"
          echo "TAILSCALE STATE DIRECTORY"
          echo "========================================"
          sudo ls -lah /var/lib/tailscale || true

          echo
          echo "========================================"
          echo "LOCAL SSH HOST KEY FINGERPRINTS"
          echo "========================================"

          for key in /etc/ssh/ssh_host_*_key.pub; do
            if [ -f "$key" ]; then
              echo
              echo "File: $key"
              ssh-keygen -lf "$key" || true
            fi
          done

          echo
          echo "========================================"
          echo "PORT 22 LISTENERS"
          echo "========================================"
          sudo ss -ltnp | grep ':22' || true

          echo
          echo "========================================"
          echo "SSH / TAILSCALE PROCESSES"
          echo "========================================"
          ps aux | grep -E '[t]ailscaled|[s]shd' || true

          echo
          echo "========================================"
          echo "SYSTEM SSH SERVICE"
          echo "========================================"
          sudo systemctl status ssh --no-pager || true
          sudo systemctl status sshd --no-pager || true

          echo
          echo "========================================"
          echo "EFFECTIVE SSHD CONFIG"
          echo "========================================"
          sudo sshd -T 2>/dev/null | \
            grep -E '^(port|listenaddress|passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication)' \
            || true

          echo
          echo "========================================"
          echo "NETWORK INTERFACES"
          echo "========================================"
          ip addr || true

          echo
          echo "========================================"
          echo "ROUTING TABLE"
          echo "========================================"
          ip route || true

          echo
          echo "========================================"
          echo "TAILSCALE NETCHECK"
          echo "========================================"
          tailscale netcheck || true

          echo
          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"
